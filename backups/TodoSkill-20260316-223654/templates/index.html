<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoSkill Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="layout">
    <section class="panel hero">
      <div class="eyebrow">TodoSkill / LangGraph / llama.cpp</div>
      <h1>本地多模态待办助手</h1>
      <p>输入文字，或上传一张图片，让本地模型帮你提取并管理待办事项。</p>
      <form id="chat-form" class="composer">
        <textarea id="message" name="message" placeholder="例如：帮我把图片里的事项整理成待办，并创建进去"></textarea>
        <div class="composer-row">
          <input id="image" name="image" type="file" accept="image/*">
          <button type="submit">发送</button>
        </div>
      </form>
      <div id="status" class="status">等待输入</div>
    </section>

    <section class="panel conversation">
      <div class="section-title">最近问答</div>
      <div id="messages" class="messages">
        {% for item in history %}
        <article class="message-card">
          <div class="message-meta">
            <span class="message-title">{{ item.title }}</span>
            <span>{{ item.created_at }}</span>
          </div>
          <div class="message-block">
            <label>你</label>
            <p>{{ item.user_message }}</p>
          </div>
          <div class="message-block assistant">
            <label>助手</label>
            <p>{{ item.assistant_message }}</p>
          </div>
        </article>
        {% endfor %}
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");

    function addMessageCard(title, userText, assistantText, createdAt) {
      const card = document.createElement("article");
      card.className = "message-card";
      card.innerHTML = `
        <div class="message-meta">
          <span class="message-title"></span>
          <span></span>
        </div>
        <div class="message-block">
          <label>你</label>
          <p></p>
        </div>
        <div class="message-block assistant">
          <label>助手</label>
          <p></p>
        </div>
      `;
      const metaValues = card.querySelectorAll(".message-meta span");
      metaValues[0].textContent = title;
      metaValues[1].textContent = createdAt;
      const paragraphs = card.querySelectorAll(".message-block p");
      paragraphs[0].textContent = userText;
      paragraphs[1].textContent = assistantText;
      messagesEl.prepend(card);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("message").value.trim();
      if (!message) {
        statusEl.textContent = "请输入内容后再发送";
        return;
      }

      const formData = new FormData(form);
      statusEl.textContent = "正在处理，请稍候...";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        addMessageCard(
          data.title,
          message,
          data.assistant_message,
          new Date().toLocaleString("zh-CN", { hour12: false })
        );
        form.reset();
        statusEl.textContent = `完成：${data.intent || "chat"}`;
      } catch (error) {
        statusEl.textContent = `请求失败：${error}`;
      }
    });
  </script>
</body>
</html>
